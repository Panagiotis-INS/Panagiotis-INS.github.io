<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Latest | Panagiotis Fiskilis / Neuro</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>

<body>
  <header class="topbar">
    <div class="brand">
      <a href="/">Panagiotis Fiskilis - Neuro</a>
    </div>

    <nav class="nav">
      <a href="/">Home</a>
      <a href="/blog/">Blog</a>
    </nav>
  </header>

  <main class="container">
    <section class="latest latest-page" id="latest" aria-labelledby="latest-heading">
      <div class="latest-head">
        <h2 id="latest-heading">Latest</h2>
        <div class="latest-controls" role="group" aria-label="Number of latest articles to show">
          <button type="button" class="latest-btn is-active" data-count="5">5</button>
          <button type="button" class="latest-btn" data-count="15">15</button>
          <button type="button" class="latest-btn" data-count="all">All</button>
        </div>
      </div>
      <ol class="latest-list" id="latest-list"></ol>
      <p class="latest-status" id="latest-status" hidden></p>
    </section>

    <script>
      (function () {
        var controls = document.querySelector('.latest-controls');
        var list     = document.getElementById('latest-list');
        var status   = document.getElementById('latest-status');
        var feedUrl  = "/posts.json";
        var posts    = null;
        var count    = 5;

        // Deep-link: /latest/?show=5|15|all preselects a view.
        var initial = new URLSearchParams(window.location.search).get('show');
        if (initial && /^(5|15|all)$/.test(initial)) {
          var preset = controls.querySelector('.latest-btn[data-count="' + initial + '"]');
          if (preset) {
            Array.prototype.forEach.call(controls.querySelectorAll('.latest-btn'), function (b) {
              b.classList.toggle('is-active', b === preset);
            });
            count = (initial === 'all') ? 'all' : parseInt(initial, 10);
          }
        }

        function fmtDate(iso) {
          if (!iso) return '';
          var d = new Date(iso);
          if (isNaN(d)) return iso;
          return d.toISOString().slice(0, 10);
        }

        function render() {
          if (!posts) return;
          list.innerHTML = '';
          var slice = (count === 'all') ? posts : posts.slice(0, count);
          if (!slice.length) {
            status.hidden = false;
            status.textContent = 'No articles yet.';
            list.hidden = true;
            return;
          }
          status.hidden = true;
          list.hidden = false;
          slice.forEach(function (p) {
            var li   = document.createElement('li');
            li.className = 'latest-item';
            var a    = document.createElement('a');
            a.href   = p.url;
            a.className = 'latest-title';
            a.textContent = p.title;
            var meta = document.createElement('span');
            meta.className = 'latest-meta';
            var cats = (p.categories && p.categories.length) ? ' — ' + p.categories.join(', ') : '';
            meta.textContent = fmtDate(p.date) + cats;
            li.appendChild(a);
            li.appendChild(meta);
            list.appendChild(li);
          });
        }

        function load() {
          status.hidden = false;
          status.textContent = 'Loading…';
          return fetch(feedUrl, { cache: 'no-cache' })
            .then(function (r) {
              if (!r.ok) throw new Error('HTTP ' + r.status);
              return r.json();
            })
            .then(function (data) {
              posts = data.sort(function (a, b) { return (b.date || '').localeCompare(a.date || ''); });
              render();
            })
            .catch(function (err) {
              status.hidden = false;
              status.textContent = 'Could not load articles (' + err.message + ').';
            });
        }

        controls.addEventListener('click', function (e) {
          var btn = e.target.closest('.latest-btn');
          if (!btn) return;
          var val = btn.dataset.count;
          count = (val === 'all') ? 'all' : parseInt(val, 10);
          Array.prototype.forEach.call(controls.querySelectorAll('.latest-btn'), function (b) {
            b.classList.toggle('is-active', b === btn);
          });
          render();
        });

        load();
      })();
    </script>
  </main>
</body>
</html>
